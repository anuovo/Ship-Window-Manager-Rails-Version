services:
  - type: web
    name: ship-window-manager
    runtime: ruby
    buildCommand: bundle install && bundle exec rails assets:precompile
    preDeployCommand: bundle exec rails db:migrate db:seed
    startCommand: bundle exec puma -C config/puma.rb
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: true
      - key: WEB_CONCURRENCY
        value: 2
      - key: DATABASE_URL
        fromDatabase:
          name: ship-window-manager-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true

databases:
  - name: ship-window-manager-db
    databaseName: ship_window_manager
    user: ship_window_manager
